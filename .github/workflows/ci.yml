name: ThreadForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTHREADFORGE_BUILD_TESTS=ON
          -DTHREADFORGE_BUILD_EXAMPLES=ON
          -DTHREADFORGE_BUILD_BENCHMARKS=ON

      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run CTest Unit Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Run Examples
        run: |
          ./build/example_basic_usage
          ./build/example_priority_scheduling
          ./build/example_concurrent_submission
          ./build/example_exception_handling
          ./build/example_graceful_shutdown

      - name: Run Performance Benchmark
        run: ./build/scheduler_benchmark --csv

  sanitizers:
    name: Linux / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan-ubsan, tsan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgtest-dev
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure Sanitizers
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTHREADFORGE_ENABLE_ASAN_UBSAN=ON -DTHREADFORGE_BUILD_TESTS=ON -DTHREADFORGE_BUILD_EXAMPLES=ON -DTHREADFORGE_BUILD_BENCHMARKS=OFF
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTHREADFORGE_ENABLE_TSAN=ON -DTHREADFORGE_BUILD_TESTS=ON -DTHREADFORGE_BUILD_EXAMPLES=ON -DTHREADFORGE_BUILD_BENCHMARKS=OFF
          fi

      - name: Build Targets
        run: cmake --build build

      - name: Run Instrumented CTest Tests
        run: ctest --test-dir build --output-on-failure
